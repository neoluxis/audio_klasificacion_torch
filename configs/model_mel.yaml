model:
  input_type: mel
  num_classes: 12
  blocks:
    - type: cnn
      in_channels: 1
      out_channels: 32
      kernel_size: 3
      stride: 1
      padding: 1
      pool: max
      pool_kernel: 2
      is_1d: false
    - type: cnn
      in_channels: 32
      out_channels: 64
      kernel_size: 3
      stride: 1
      padding: 1
      pool: max
      pool_kernel: 2
      is_1d: false
    - type: adaptive_pool
      output_size: [4, 4]
      is_1d: false
    - type: flatten
    - type: gru
      input_size: 1024  # Corrected: 64 * 4 * 4 = 1024
      hidden_size: 128
      num_layers: 2
      dropout: 0.3
    - type: fc
      in_features: 128
      out_features: 12