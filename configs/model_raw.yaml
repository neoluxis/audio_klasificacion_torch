model:
  input_type: raw
  num_classes: 12
  blocks:
    - type: cnn
      in_channels: 1
      out_channels: 32
      kernel_size: 7
      stride: 2
      padding: 3
      pool: max
      pool_kernel: 4
      is_1d: true
    - type: cnn
      in_channels: 32
      out_channels: 64
      kernel_size: 7
      stride: 2
      padding: 3
      pool: max
      pool_kernel: 4
      is_1d: true
    - type: adaptive_pool
      output_size: [4]
      is_1d: true
    - type: flatten
    - type: gru
      input_size: 256  # 64 * 4
      hidden_size: 128
      num_layers: 2
      dropout: 0.3
    - type: fc
      in_features: 128
      out_features: 12